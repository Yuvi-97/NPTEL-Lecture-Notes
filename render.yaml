services:
  # 1. Backend Web Service
  - type: web
    name: nptel-notes-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: nptel-notes-db
          property: connectionString

  # 2. Frontend Static Site
  - type: web
    name: nptel-notes-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: nptel-notes-backend
          property: host

databases:
  # Free Managed PostgreSQL Database
  - name: nptel-notes-db
    plan: free
    databaseName: nptel_notes
    user: nptel_user
