<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#091834" />
    </linearGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Frame -->
  <path d="M50 4 L88 26 L88 74 L50 96 L12 74 L12 26 Z" 
        stroke="url(#hexGrad)" 
        stroke-width="7" 
        stroke-linejoin="round" 
        fill="#ffffff" />

  <!-- Inner Hexagon Shading -->
  <path d="M50 9 L84 28.5 L84 71.5 L50 91 L16 71.5 L16 28.5 Z" 
        fill="#f8fafc" />

  <!-- Open Book Left Wings -->
  <path d="M48 68 L24 57 L24 43 L48 54 Z" fill="#0284c7" opacity="0.85" />
  <path d="M48 68 L28 53 L28 38 L48 51 Z" fill="#0ea5e9" opacity="0.9" />
  <path d="M48 68 L33 49 L33 33 L48 48 Z" fill="url(#bookLeft)" />

  <!-- Open Book Right Wings -->
  <path d="M52 68 L76 57 L76 43 L52 54 Z" fill="#0369a1" opacity="0.85" />
  <path d="M52 68 L72 53 L72 38 L52 51 Z" fill="#0284c7" opacity="0.9" />
  <path d="M52 68 L67 49 L67 33 L52 48 Z" fill="url(#bookRight)" />

  <!-- Book Spine Base Stem -->
  <polygon points="46,68 54,68 50,76" fill="#091834" />
  <line x1="50" y1="48" x2="50" y2="76" stroke="#091834" stroke-width="2" stroke-linecap="round" />

  <!-- Central Star of Knowledge (4-Point Diamond Spark) -->
  <path d="M50 18 Q50 28 44 28 Q50 28 50 38 Q50 28 56 28 Q50 28 50 18 Z" 
        fill="url(#starGrad)" 
        filter="url(#glow)" />
</svg>
